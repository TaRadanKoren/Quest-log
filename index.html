const ITER=600000;

const b2u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const pw=document.getElementById('pw'), go=document.getElementById('go'), err=document.getElementById('err');

async function unlock(){
  err.textContent='';
  if(!pw.value){ err.textContent='Zadaj heslo.'; return; }
  if(!(window.crypto && crypto.subtle)){ err.textContent='Tento prehliadač nepodporuje odomknutie (potrebuje https).'; return; }
  go.disabled=true; go.textContent='Odomykám…';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(IV)},key,b2u(DATA));
    const html=new TextDecoder().decode(buf);
    document.open(); document.write(html); document.close();
  }catch(e){
    err.textContent='Nesprávne heslo.';
    go.disabled=false; go.textContent='Odomknúť';
    pw.select();
  }
}
go.addEventListener('click',unlock);
pw.addEventListener('keydown',e=>{ if(e.key==='Enter') unlock(); });
</script>
