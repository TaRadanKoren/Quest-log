<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap');

:root{
  --ink:#1c130c;
  --board:#241a12;
  --board-2:#2e2116;
  --leather:#3c2a1c;
  --leather-light:#4d3624;
  --parchment:#ecdfbd;
  --parchment-2:#e2d3aa;
  --parchment-ink:#2c2013;
  --parchment-ink-dim:#5c4b34;
  --gold:#c9973f;
  --gold-bright:#e2b565;
  --rust:#7a3226;
  --easy:#4c6b8a;
  --medium:#c79a3d;
  --hard:#8b3a2a;
  --mama:#6b3f73;

  --font-display:'Rye', serif;
  --font-body:'Special Elite', 'Courier New', monospace;
}

*{ box-sizing:border-box; }

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:
    radial-gradient(ellipse at top, rgba(255,255,255,0.03), transparent 60%),
    radial-gradient(ellipse at bottom, rgba(0,0,0,0.4), transparent 60%),
    var(--ink);
  color:var(--parchment);
  font-family:var(--font-body);
}

#app{
  max-width:1100px;
  margin:0 auto;
  padding:28px 20px 80px;
}

/* ---------- Header ---------- */
.board-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
  padding-bottom:18px;
  border-bottom:2px solid var(--leather-light);
  margin-bottom:22px;
}
.board-title{
  font-family:var(--font-display);
  font-size:44px;
  letter-spacing:1px;
  color:var(--gold-bright);
  text-shadow:2px 2px 0 rgba(0,0,0,0.5);
  margin:0;
}
.board-subtitle{
  margin:4px 0 0;
  font-size:13px;
  color:var(--parchment-2);
  opacity:0.7;
}
.btn-new{
  font-family:var(--font-body);
  font-size:14px;
  background:var(--rust);
  color:var(--parchment);
  border:2px dashed var(--gold);
  border-radius:3px;
  padding:11px 18px;
  cursor:pointer;
  transition:transform .12s ease, background .15s ease;
}
.btn-new:hover{ background:#8f3d2c; transform:translateY(-1px); }
.btn-new:active{ transform:translateY(0px); }

/* ---------- Tabs ---------- */
.tabs{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.tab{
  font-family:var(--font-display);
  font-size:17px;
  letter-spacing:0.5px;
  background:var(--leather);
  color:var(--parchment-2);
  border:none;
  border-bottom:3px solid transparent;
  padding:10px 18px 8px;
  border-radius:6px 6px 0 0;
  cursor:pointer;
  opacity:0.75;
  transition:opacity .15s ease, background .15s ease;
}
.tab:hover{ opacity:0.95; }
.tab.active{
  background:var(--board-2);
  color:var(--gold-bright);
  border-bottom:3px solid var(--gold);
  opacity:1;
}
.tab .count{
  font-family:var(--font-body);
  font-size:11px;
  opacity:0.8;
  margin-left:6px;
}

/* ---------- Content panel ---------- */
.panel{
  background:var(--board-2);
  border:1px solid var(--leather-light);
  border-radius:0 8px 8px 8px;
  padding:26px;
  min-height:300px;
}

.panel-toolbar{
  display:flex;
  justify-content:flex-end;
  margin-bottom:20px;
}

.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--parchment-2);
  opacity:0.7;
}
.empty-state p{ font-size:14px; line-height:1.6; max-width:380px; margin:0 auto 18px; }

/* ---------- Grid ---------- */
.quest-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
  gap:26px;
}

/* ---------- Quest card (wanted poster) ---------- */
.quest-card{
  position:relative;
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,0.25), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(0,0,0,0.08), transparent 45%),
    var(--parchment);
  color:var(--parchment-ink);
  border-radius:2px;
  padding:20px 18px 16px;
  box-shadow:0 6px 14px rgba(0,0,0,0.45);
  border:1px solid rgba(0,0,0,0.15);
  outline:6px solid rgba(0,0,0,0.06);
  outline-offset:-6px;
}
.quest-card.paused{ filter:saturate(0.75); }

.quest-card::before{ /* pin */
  content:"";
  position:absolute;
  top:-7px;
  left:50%;
  transform:translateX(-50%);
  width:14px;
  height:14px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ddd, #777 70%, #333);
  box-shadow:0 2px 3px rgba(0,0,0,0.5);
}

.corner-ribbon{
  position:absolute;
  top:0;
  left:0;
  width:0;
  height:0;
  border-style:solid;
  border-width:34px 34px 0 0;
}
.corner-ribbon span{
  position:absolute;
  top:-28px;
  left:2px;
  font-family:var(--font-display);
  font-size:11px;
  color:#fff;
  transform:rotate(-45deg);
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
  margin-left:20px;
}
.quest-title{
  font-family:var(--font-display);
  font-size:20px;
  line-height:1.25;
  margin:0;
  padding-right:4px;
}
.stars{
  font-size:14px;
  letter-spacing:1px;
  color:var(--gold);
  white-space:nowrap;
  margin-top:2px;
}
.stars .empty{ color:rgba(0,0,0,0.2); }

.status-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:12px 0 6px;
  margin-left:20px;
}
.stamp{
  font-family:var(--font-display);
  font-size:12px;
  letter-spacing:1px;
  color:var(--rust);
  border:2px solid var(--rust);
  border-radius:4px;
  padding:2px 8px;
  transform:rotate(-6deg);
  opacity:0.85;
  mix-blend-mode:multiply;
  white-space:nowrap;
}
.stamp.done{ color:#2f5c3a; border-color:#2f5c3a; }

.progress-track{
  height:10px;
  background:rgba(0,0,0,0.15);
  border-radius:5px;
  overflow:hidden;
  margin:10px 0 4px;
  margin-left:20px;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg, var(--gold), var(--gold-bright));
}
.progress-label{
  font-size:11px;
  opacity:0.65;
  margin-left:20px;
  margin-bottom:8px;
}

.waiting-note{
  background:#f2e08a;
  color:#3a3210;
  font-size:11.5px;
  padding:6px 9px;
  border-radius:2px;
  margin:10px 0 4px 20px;
  display:inline-block;
  transform:rotate(-1.2deg);
  box-shadow:1px 1px 3px rgba(0,0,0,0.25);
}

.checklist-toggle{
  background:none;
  border:none;
  color:var(--parchment-ink-dim);
  font-family:var(--font-body);
  font-size:12.5px;
  cursor:pointer;
  padding:6px 0 6px 20px;
  text-align:left;
}
.checklist{
  margin:0 0 8px 20px;
  padding-left:0;
  list-style:none;
}
.checklist li{
  display:flex;
  align-items:flex-start;
  gap:7px;
  font-size:13px;
  padding:3px 0;
  cursor:pointer;
}
.checklist li.done{ opacity:0.55; text-decoration:line-through; }
.checklist input{ margin-top:3px; }
.checklist li.blocked{ cursor:not-allowed; opacity:0.6; }
.checklist li.blocked input{ cursor:not-allowed; }
.dep-note{
  display:block;
  font-style:normal;
  font-size:10.5px;
  color:var(--rust);
  opacity:0.85;
  margin-top:1px;
}

.checklist-section{ margin-left:20px; }
.section-title{
  font-family:var(--font-display);
  font-size:12.5px;
  letter-spacing:0.5px;
  color:var(--parchment-ink-dim);
  border-bottom:1px solid rgba(0,0,0,0.15);
  padding-top:8px;
  margin-bottom:2px;
}
.checklist-section .checklist{ margin-left:0; }

.resources{
  margin:8px 0 2px 20px;
  font-size:11px;
  line-height:1.5;
  color:var(--parchment-ink-dim);
}
.resources-label{ margin-right:4px; }
.resources a{ color:var(--rust); text-decoration:underline; }

.card-footer{
  display:flex;
  justify-content:flex-end;
  gap:6px;
  margin-top:10px;
  border-top:1px solid rgba(0,0,0,0.12);
  padding-top:8px;
}
.icon-btn{
  background:none;
  border:1px solid rgba(0,0,0,0.2);
  border-radius:3px;
  width:30px;
  height:28px;
  cursor:pointer;
  font-size:14px;
  color:var(--parchment-ink);
  opacity:0.75;
}
.icon-btn:hover{ opacity:1; background:rgba(0,0,0,0.06); }

.paused-banner{
  position:absolute;
  top:38%;
  left:-8%;
  width:116%;
  text-align:center;
  background:rgba(122,50,38,0.88);
  color:var(--parchment);
  font-family:var(--font-display);
  font-size:18px;
  letter-spacing:3px;
  padding:5px 0;
  transform:rotate(-9deg);
  box-shadow:0 3px 8px rgba(0,0,0,0.4);
  pointer-events:none;
}

.reopen-btn{
  font-family:var(--font-body);
  font-size:11.5px;
  background:none;
  border:1px solid var(--parchment-ink-dim);
  color:var(--parchment-ink-dim);
  border-radius:3px;
  padding:4px 8px;
  cursor:pointer;
}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}
.modal{
  background:var(--parchment);
  color:var(--parchment-ink);
  border-radius:4px;
  width:100%;
  max-width:480px;
  max-height:88vh;
  overflow-y:auto;
  padding:26px 24px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);
}
.modal h2{
  font-family:var(--font-display);
  font-size:24px;
  margin:0 0 18px;
  color:var(--rust);
}
.field{ margin-bottom:16px; }
.field label{
  display:block;
  font-size:11.5px;
  text-transform:none;
  color:var(--parchment-ink-dim);
  margin-bottom:5px;
}
.field input[type="text"], .field textarea{
  width:100%;
  font-family:var(--font-body);
  font-size:14px;
  padding:8px 10px;
  border:1px solid rgba(0,0,0,0.25);
  border-radius:3px;
  background:#fbf6e6;
  color:var(--parchment-ink);
}
.field textarea{ resize:vertical; min-height:50px; }

.pill-group{ display:flex; gap:8px; flex-wrap:wrap; }
.pill{
  border:2px solid transparent;
  border-radius:16px;
  padding:6px 14px;
  font-family:var(--font-body);
  font-size:12.5px;
  cursor:pointer;
  color:#fff;
}
.pill.selected{ border-color:var(--parchment-ink); }

.star-picker{ font-size:22px; color:var(--gold); cursor:pointer; }
.star-picker span{ margin-right:2px; }
.star-picker .off{ color:rgba(0,0,0,0.2); }

.checklist-edit-row{
  display:flex;
  gap:6px;
  margin-bottom:6px;
}
.checklist-edit-row input{ flex:1; }
.row-remove{
  background:none;
  border:1px solid rgba(0,0,0,0.25);
  border-radius:3px;
  cursor:pointer;
  width:30px;
}
.add-row-btn{
  background:none;
  border:1px dashed var(--parchment-ink-dim);
  color:var(--parchment-ink-dim);
  border-radius:3px;
  padding:6px 10px;
  font-size:12.5px;
  cursor:pointer;
  margin-top:2px;
}

.modal-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:20px;
  gap:10px;
}
.btn-primary{
  background:var(--rust);
  color:var(--parchment);
  border:none;
  border-radius:3px;
  padding:10px 20px;
  font-family:var(--font-body);
  font-size:13.5px;
  cursor:pointer;
}
.btn-secondary{
  background:none;
  border:1px solid rgba(0,0,0,0.25);
  color:var(--parchment-ink);
  border-radius:3px;
  padding:10px 16px;
  font-family:var(--font-body);
  font-size:13.5px;
  cursor:pointer;
}
.btn-delete{
  background:none;
  border:none;
  color:var(--hard);
  font-family:var(--font-body);
  font-size:12.5px;
  cursor:pointer;
  text-decoration:underline;
}

.error-banner{
  background:var(--hard);
  color:var(--parchment);
  padding:10px 16px;
  border-radius:4px;
  font-size:13px;
  margin-bottom:16px;
}

@media (max-width:520px){
  .board-title{ font-size:32px; }
  .quest-grid{ grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div id="app"><p style="padding:40px;text-align:center;opacity:.6;">Načítavam questy…</p></div>

<script>
const CATEGORIES = [
  {key:'vlastne', label:'Vlastné projekty'},
  {key:'skola', label:'Škola'},
  {key:'domacnost', label:'Domácnosť'}
];
const DIFFICULTY = {
  easy:   {label:'Easy',   color:'var(--easy)',   glyph:'E'},
  medium: {label:'Medium', color:'var(--medium)', glyph:'M'},
  hard:   {label:'Hard',   color:'var(--hard)',   glyph:'H'},
  mama:   {label:'Mama',   color:'var(--mama)',   glyph:'♥'}
};
const STATUS_LABEL = {
  making:'VO VÝROBE', started:'NAČATÉ', progress:'IN PROGRESS', almost:'ALMOST THERE', done:'DONE'
};

let quests = [];
let activeTab = 'vlastne';
let expanded = new Set();
let modal = null; // {mode:'add'|'edit', data:{...}, checklistRows:[{text}], errors:[]}
let loadError = null;

function uid(){ return 'q_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

function rotationFor(id){
  let h = 0;
  for(let i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) | 0; }
  return ((Math.abs(h) % 30) / 10) - 1.5;
}

function getAllItems(q){
  let items = (q.checklist || []).slice();
  if(q.sections){ q.sections.forEach(s => { items = items.concat(s.items); }); }
  return items;
}

function findItemById(q, itemId){
  return getAllItems(q).find(i => i.id === itemId) || null;
}

function isBlocked(q, item){
  if(!item.dependsOnId) return false;
  const dep = findItemById(q, item.dependsOnId);
  return !!dep && !dep.done;
}

function getPercent(q){
  const items = getAllItems(q);
  if(!items.length) return 0;
  const done = items.filter(c=>c.done).length;
  return Math.round(100 * done / items.length);
}

function getStatus(q){
  if(q.completed) return 'done';
  if(!getAllItems(q).length) return 'making';
  const pct = getPercent(q);
  if(pct >= 100) return 'done';
  if(pct >= 80) return 'almost';
  if(pct >= 30) return 'progress';
  return 'started';
}

async function loadQuests(){
  try{
    const res = await window.storage.get('quests-data', false);
    quests = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    quests = [];
  }
}

async function saveQuests(){
  try{
    await window.storage.set('quests-data', JSON.stringify(quests), false);
    loadError = null;
  }catch(e){
    loadError = 'Uloženie zlyhalo. Skontroluj pripojenie a skús to znova.';
  }
  render();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function starsHtml(n){
  let out = '';
  for(let i=1;i<=5;i++){ out += `<span class="${i<=n?'':'empty'}">★</span>`; }
  return `<span class="stars">${out}</span>`;
}

function itemRow(q, c){
  const blocked = isBlocked(q, c);
  const dep = c.dependsOnId ? findItemById(q, c.dependsOnId) : null;
  return `
    <li class="${c.done?'done':''} ${blocked?'blocked':''}" onclick="${blocked?'':`toggleChecklistItem('${q.id}','${c.id}')`}">
      <input type="checkbox" style="accent-color:${DIFFICULTY[q.difficulty].color};" ${c.done?'checked':''} ${blocked?'disabled':''} onclick="event.stopPropagation(); toggleChecklistItem('${q.id}','${c.id}')">
      <span>${escapeHtml(c.text)}${blocked ? `<em class="dep-note">🔒 čaká na: ${escapeHtml(dep.text)}</em>` : ''}</span>
    </li>`;
}

function questCard(q){
  const status = getStatus(q);
  const pct = getPercent(q);
  const diff = DIFFICULTY[q.difficulty];
  const isExpanded = expanded.has(q.id);
  const rot = rotationFor(q.id).toFixed(2);
  const allItems = getAllItems(q);
  const doneCount = allItems.filter(c=>c.done).length;

  let checklistBody = '';
  if(isExpanded){
    if(q.sections && q.sections.length){
      checklistBody += q.sections.map(sec => `
        <div class="checklist-section">
          <div class="section-title">${escapeHtml(sec.title)}</div>
          <ul class="checklist">${sec.items.map(c => itemRow(q,c)).join('')}</ul>
        </div>`).join('');
    }
    if(q.checklist && q.checklist.length){
      checklistBody += `<ul class="checklist">${q.checklist.map(c => itemRow(q,c)).join('')}</ul>`;
    }
  }

  const checklistHtml = allItems.length ? `
    <button class="checklist-toggle" onclick="toggleExpand('${q.id}')">
      ${isExpanded ? '▾' : '▸'} Úlohy (${doneCount}/${allItems.length})
    </button>
    ${checklistBody}
  ` : '';

  const resourcesHtml = (q.resources && q.resources.length) ? `
    <div class="resources">
      <span class="resources-label">🔗 Zdroje:</span>
      ${q.resources.map(r => `<a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.label)}</a>`).join(', ')}
    </div>` : '';

  const footerButtons = q.completed
    ? `<button class="reopen-btn" onclick="reopenQuest('${q.id}')">↺ Znovu otvoriť</button>
       <button class="icon-btn" onclick="deleteQuest('${q.id}')" title="Zmazať">🗑</button>`
    : `<button class="icon-btn" onclick="togglePause('${q.id}')" title="${q.paused?'Pokračovať':'Pauznúť'}">${q.paused?'▶':'⏸'}</button>
       <button class="icon-btn" onclick="openEditModal('${q.id}')" title="Upraviť">✎</button>
       <button class="icon-btn" onclick="deleteQuest('${q.id}')" title="Zmazať">🗑</button>`;

  return `
  <div class="quest-card ${q.paused && !q.completed ? 'paused':''}" style="transform:rotate(${rot}deg);">
    <div class="corner-ribbon" style="border-color:${diff.color} transparent transparent transparent;">
      <span>${diff.glyph}</span>
    </div>
    <div class="card-top">
      <h3 class="quest-title">${escapeHtml(q.title)}</h3>
      ${starsHtml(q.urgency)}
    </div>
    <div class="status-row">
      <span class="stamp ${status==='done'?'done':''}">${STATUS_LABEL[status]}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <div class="progress-label">${pct}% hotovo</div>
    ${q.waitingNote ? `<div class="waiting-note">📌 Poznámka: ${escapeHtml(q.waitingNote)}</div>` : ''}
    ${resourcesHtml}
    ${checklistHtml}
    <div class="card-footer">${footerButtons}</div>
    ${q.paused && !q.completed ? `<div class="paused-banner">PAUSED</div>` : ''}
  </div>`;
}

function emptyStateHtml(tab){
  if(tab === 'completed'){
    return `<div class="empty-state"><p>Zatiaľ žiadne splnené questy. Keď dotiahneš checklist na 100 %, quest sa sem presunie sám.</p></div>`;
  }
  return `<div class="empty-state">
    <p>Táto nástenka je zatiaľ prázdna. Pridaj svoj prvý quest a maj ho konečne na očiach.</p>
  </div>`;
}

function render(){
  const app = document.getElementById('app');

  const tabsHtml = CATEGORIES.map(c => {
    const count = quests.filter(q => q.category===c.key && !q.completed).length;
    return `<button class="tab ${activeTab===c.key?'active':''}" onclick="setTab('${c.key}')">${c.label}<span class="count">${count}</span></button>`;
  }).join('') + `<button class="tab ${activeTab==='completed'?'active':''}" onclick="setTab('completed')">Splnené<span class="count">${quests.filter(q=>q.completed).length}</span></button>`;

  let list;
  if(activeTab === 'completed'){
    list = quests.filter(q=>q.completed).sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
  }else{
    list = quests.filter(q=>q.category===activeTab && !q.completed)
      .sort((a,b)=> b.urgency - a.urgency || getPercent(b)-getPercent(a));
  }

  const gridHtml = list.length
    ? `<div class="quest-grid">${list.map(questCard).join('')}</div>`
    : emptyStateHtml(activeTab);

  const toolbarHtml = activeTab !== 'completed'
    ? `<div class="panel-toolbar"><button class="btn-new" onclick="openAddModal()">+ Nový quest</button></div>`
    : '';

  app.innerHTML = `
    <div class="board-header">
      <div>
        <h1 class="board-title">Quest Log</h1>
        <p class="board-subtitle">Nástenka tvojich výprav</p>
      </div>
    </div>
    ${loadError ? `<div class="error-banner">${loadError}</div>` : ''}
    <div class="tabs">${tabsHtml}</div>
    <div class="panel">${toolbarHtml}${gridHtml}</div>
    ${modal ? modalHtml() : ''}
  `;

  if(modal){ attachModalEvents(); }
}

function setTab(tab){ activeTab = tab; render(); }

function toggleExpand(id){
  if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
  render();
}

async function toggleChecklistItem(qid, cid){
  const q = quests.find(x=>x.id===qid);
  if(!q) return;
  const item = findItemById(q, cid);
  if(!item) return;
  if(isBlocked(q, item)) return;
  item.done = !item.done;
  if(getPercent(q) >= 100 && !q.completed){
    q.completed = true;
    q.completedAt = Date.now();
  }
  await saveQuests();
}

async function togglePause(qid){
  const q = quests.find(x=>x.id===qid);
  if(!q) return;
  q.paused = !q.paused;
  await saveQuests();
}

async function reopenQuest(qid){
  const q = quests.find(x=>x.id===qid);
  if(!q) return;
  q.completed = false;
  q.completedAt = null;
  await saveQuests();
}

async function deleteQuest(qid){
  if(!confirm('Naozaj chceš tento quest natrvalo zmazať?')) return;
  quests = quests.filter(q=>q.id!==qid);
  await saveQuests();
}

/* ---------- Modal ---------- */

function openAddModal(){
  modal = {
    mode:'add',
    id:null,
    title:'',
    category: activeTab === 'completed' ? 'vlastne' : activeTab,
    difficulty:'easy',
    urgency:1,
    waitingNote:'',
    checklistRows:[{text:''}],
    error:''
  };
  render();
}

function openEditModal(qid){
  const q = quests.find(x=>x.id===qid);
  if(!q) return;
  modal = {
    mode:'edit',
    id:q.id,
    title:q.title,
    category:q.category,
    difficulty:q.difficulty,
    urgency:q.urgency,
    waitingNote:q.waitingNote || '',
    checklistRows: q.checklist.length ? q.checklist.map(c=>({text:c.text, id:c.id})) : [{text:''}],
    error:''
  };
  render();
}

function closeModal(){ modal = null; render(); }

function modalHtml(){
  const isEdit = modal.mode === 'edit';
  return `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <h2>${isEdit ? 'Upraviť quest' : 'Nový quest'}</h2>
      ${modal.error ? `<div class="error-banner">${modal.error}</div>` : ''}

      <div class="field">
        <label>Názov questu</label>
        <input type="text" id="m-title" value="${escapeHtml(modal.title)}" placeholder="napr. Dokončiť esej z dejepisu">
      </div>

      <div class="field">
        <label>Kategória</label>
        <div class="pill-group">
          ${CATEGORIES.map(c => `<button type="button" class="pill ${modal.category===c.key?'selected':''}" style="background:var(--leather-light);" onclick="setModalField('category','${c.key}')">${c.label}</button>`).join('')}
        </div>
      </div>

      <div class="field">
        <label>Obtiažnosť</label>
        <div class="pill-group">
          ${Object.keys(DIFFICULTY).map(k => `<button type="button" class="pill ${modal.difficulty===k?'selected':''}" style="background:${DIFFICULTY[k].color};" onclick="setModalField('difficulty','${k}')">${DIFFICULTY[k].label}</button>`).join('')}
        </div>
      </div>

      <div class="field">
        <label>Súrnosť</label>
        <div class="star-picker">
          ${[1,2,3,4,5].map(i => `<span class="${i<=modal.urgency?'':'off'}" onclick="setModalField('urgency',${i})">★</span>`).join('')}
        </div>
      </div>

      <div class="field">
        <label>Checklist úloh</label>
        <div id="checklist-rows">
          ${modal.checklistRows.map((r,idx) => `
            <div class="checklist-edit-row">
              <input type="text" data-idx="${idx}" class="cl-row-input" value="${escapeHtml(r.text)}" placeholder="úloha...">
              <button type="button" class="row-remove" onclick="removeChecklistRow(${idx})">✕</button>
            </div>`).join('')}
        </div>
        <button type="button" class="add-row-btn" onclick="addChecklistRow()">+ Pridať úlohu</button>
      </div>

      <div class="field">
        <label>Poznámka (nepovinné)</label>
        <textarea id="m-waiting">${escapeHtml(modal.waitingNote)}</textarea>
      </div>

      <div class="modal-actions">
        <div>${isEdit ? `<button class="btn-delete" onclick="deleteQuest('${modal.id}'); closeModal();">Zmazať quest</button>` : ''}</div>
        <div style="display:flex; gap:8px;">
          <button class="btn-secondary" onclick="closeModal()">Zrušiť</button>
          <button class="btn-primary" onclick="submitModal()">Uložiť</button>
        </div>
      </div>
    </div>
  </div>`;
}

function attachModalEvents(){
  const titleInput = document.getElementById('m-title');
  if(titleInput) titleInput.oninput = e => { modal.title = e.target.value; };
  const waitingInput = document.getElementById('m-waiting');
  if(waitingInput) waitingInput.oninput = e => { modal.waitingNote = e.target.value; };
  document.querySelectorAll('.cl-row-input').forEach(inp => {
    inp.oninput = e => {
      const idx = parseInt(e.target.getAttribute('data-idx'), 10);
      modal.checklistRows[idx].text = e.target.value;
    };
  });
}

function setModalField(field, value){
  modal[field] = value;
  render();
  // restore focus to title if it was being edited is not critical here
}

function addChecklistRow(){
  syncRowsFromDom();
  modal.checklistRows.push({text:''});
  render();
}

function removeChecklistRow(idx){
  syncRowsFromDom();
  modal.checklistRows.splice(idx,1);
  if(!modal.checklistRows.length) modal.checklistRows.push({text:''});
  render();
}

function syncRowsFromDom(){
  document.querySelectorAll('.cl-row-input').forEach(inp => {
    const idx = parseInt(inp.getAttribute('data-idx'), 10);
    if(modal.checklistRows[idx]) modal.checklistRows[idx].text = inp.value;
  });
}

async function submitModal(){
  syncRowsFromDom();
  const title = (modal.title || '').trim();
  if(!title){
    modal.error = 'Quest potrebuje názov.';
    render();
    return;
  }
  const checklist = modal.checklistRows
    .map(r => (r.text||'').trim())
    .filter(t => t.length)
    .map(t => ({ id: uid(), text: t, done:false }));

  if(modal.mode === 'add'){
    const q = {
      id: uid(),
      title,
      category: modal.category,
      difficulty: modal.difficulty,
      urgency: modal.urgency,
      paused:false,
      waitingNote: (modal.waitingNote||'').trim(),
      checklist,
      completed:false,
      completedAt:null,
      createdAt: Date.now()
    };
    quests.push(q);
    expanded.add(q.id);
  }else{
    const q = quests.find(x=>x.id===modal.id);
    if(q){
      // preserve done state for checklist items that still exist by matching text+existing id
      const oldById = {};
      q.checklist.forEach(c => { oldById[c.id] = c; });
      const newChecklist = checklist.map(nc => {
        const matchedRow = modal.checklistRows.find(r => (r.text||'').trim() === nc.text && r.id);
        if(matchedRow && oldById[matchedRow.id]){
          return { id: matchedRow.id, text: nc.text, done: oldById[matchedRow.id].done };
        }
        return nc;
      });
      q.title = title;
      q.category = modal.category;
      q.difficulty = modal.difficulty;
      q.urgency = modal.urgency;
      q.waitingNote = (modal.waitingNote||'').trim();
      q.checklist = newChecklist;
      const pct = getPercent(q);
      if(pct >= 100 && !q.completed){ q.completed = true; q.completedAt = Date.now(); }
      if(pct < 100 && q.completed){ /* leave completed as manual state unless reopened explicitly */ }
    }
  }

  modal = null;
  await saveQuests();
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && modal){ closeModal(); }
});

async function seedInitialQuests(){
  let alreadySeeded = false;
  try{
    const flag = await window.storage.get('seed-batch-1', false);
    alreadySeeded = !!(flag && flag.value === 'done');
  }catch(e){
    alreadySeeded = false;
  }
  if(alreadySeeded) return false;

  const existingIds = new Set(quests.map(q=>q.id));
  let added = false;
  seedQuestDefinitions().forEach(q => {
    if(!existingIds.has(q.id)){ quests.push(q); added = true; }
  });
  try{
    await window.storage.set('seed-batch-1', 'done', false);
  }catch(e){ /* best effort */ }
  return added;
}

/* ---------- Init ---------- */
(async function init(){
  await loadQuests();
  const seeded = await seedInitialQuests();
  if(seeded){ await saveQuests(); } else { render(); }
})();
